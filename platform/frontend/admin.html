<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Swiftrail — Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="topbar">
    <div class="traffic"><span></span><span></span><span></span></div>
    <span class="mark"><span class="seal-dot"></span>SWIFTRAIL</span>
    <span class="sub">ADMIN DASHBOARD</span>
    <nav>
      <a href="index.html">Chat</a>
      <a href="admin.html" class="active">Admin Dashboard</a>
    </nav>
  </div>

  <div class="shell">
    <div class="sidebar col" style="width:190px;">
      <div class="heading">Sections</div>
      <div class="agent-item active" data-section="agents">
        <div class="name">Agents &amp; Tools</div>
      </div>
      <div class="agent-item" data-section="rag">
        <div class="name">RAG Documents</div>
      </div>
      <div class="agent-item" data-section="hitl">
        <div class="name">HITL Queue</div>
      </div>
      <div class="agent-item" data-section="tickets">
        <div class="name">Tickets</div>
      </div>
    </div>

    <div class="admin-shell col" style="flex:1;">
      <div id="section-agents"></div>
      <div id="section-rag" style="display:none;"></div>
      <div id="section-hitl" style="display:none;"></div>
      <div id="section-tickets" style="display:none;"></div>
    </div>
  </div>

  <script>
    const API = "/api";

    document.querySelectorAll("[data-section]").forEach(el => {
      el.onclick = () => {
        document.querySelectorAll("[data-section]").forEach(e => e.classList.remove("active"));
        el.classList.add("active");
        ["agents", "rag", "hitl", "tickets"].forEach(s =>
          document.getElementById(`section-${s}`).style.display = s === el.dataset.section ? "block" : "none");
      };
    });

    function esc(s) { return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    function ago(ts) { const s = Math.floor(Date.now() / 1000 - ts); if (s < 60) return `${s}s ago`; if (s < 3600) return `${Math.floor(s / 60)}m ago`; return `${Math.floor(s / 3600)}h ago`; }

    // ---------------- Agents & Tools ----------------
    async function loadAgents() {
      const res = await fetch(`${API}/admin/agents`);
      const el = document.getElementById("section-agents");
      if (!res.ok) {
        const error = await res.json();
        el.innerHTML = `<div class="card"><h3>Live MCP runtime unavailable</h3><div class="meta">${esc(error.detail || "Could not load runtime tools.")}</div></div>`;
        return;
      }
      const agents = await res.json();
      el.innerHTML = '<div class="grid"></div>';
      const grid = el.querySelector(".grid");
      agents.forEach(a => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `<h3>${esc(a.name)}</h3><div class="meta">${esc(a.id)} · ${esc(a.kind)}</div>`;
        a.tools.forEach(t => {
          const row = document.createElement("div");
          row.className = "tool-row";
          row.innerHTML = `<div class="name">${esc(t.tool_name)}${t.protected ? ' · required' : ''}</div><button class="toggle ${t.enabled ? 'on' : ''}" ${t.protected ? 'disabled title="Required tool"' : ''}></button>`;
          row.querySelector(".toggle").onclick = async (ev) => {
            if (t.protected) return;
            const enabled = !ev.target.classList.contains("on");
            const update = await fetch(`${API}/admin/agents/${a.id}/tools`, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ tool_name: t.tool_name, enabled })
            });
            if (!update.ok) {
              const error = await update.json();
              alert(error.detail || "The live MCP tool change failed.");
            }
            loadAgents();
          };
          card.appendChild(row);
        });
        grid.appendChild(card);
      });
    }

    // ---------------- RAG Documents ----------------
    async function loadRag() {
      const res = await fetch(`${API}/admin/rag/documents`);
      const el = document.getElementById("section-rag");
      const docs = await res.json();
      if (!res.ok) {
        el.innerHTML = `<div class="card"><h3>RAG corpus unavailable</h3><div class="meta">${esc(docs.detail)}</div></div>`;
        return;
      }
      el.innerHTML = `
    <div class="card">
      <h3>Add document</h3>
      <div class="meta">The corpus and Qdrant are rebuilt before this change is accepted.</div>
      <div class="add-doc">
        <input id="doc-title" placeholder="Title, e.g. Rail Diversion Policy" />
        <input id="doc-prefix" placeholder="Section code, e.g. RDP" maxlength="5" />
      </div>
      <div class="add-doc">
        <input id="doc-department" value="operations" placeholder="Department" />
        <input id="doc-type" value="policy" placeholder="Document type" />
      </div>
      <div class="add-doc">
        <textarea id="doc-body" placeholder="Document body / policy text..." rows="3" style="flex:1;"></textarea>
      </div>
      <div class="meta"><label><input type="checkbox" id="role-sales" checked /> Sales rep</label> &nbsp; <label><input type="checkbox" id="role-finance" checked /> Finance manager</label></div>
      <button class="btn" id="doc-add">Add document</button>
      <span class="meta" id="rag-status"></span>
    </div>
    <div class="card"><h3>Live corpus</h3><div class="meta">${docs.length} document(s) · built-in course documents are protected</div><button class="btn ghost" id="rag-reindex" style="margin:10px 0;">Re-index Qdrant</button><div id="doc-list"></div></div>
  `;
      const list = el.querySelector("#doc-list");
      docs.forEach(d => {
        const row = document.createElement("div");
        row.className = "doc-row";
        row.innerHTML = `<div><div class="name">${esc(d.title)}</div><div class="meta">${esc(d.department)} · ${esc(d.document_type)} · ${esc(d.doc_id)}</div></div>${d.removable ? '<button class="btn stop" style="padding:4px 10px;font-size:11px;">Remove</button>' : '<span class="meta">Built-in</span>'}`;
        const remove = row.querySelector("button");
        if (remove) remove.onclick = async () => {
          remove.disabled = true;
          const result = await fetch(`${API}/admin/rag/documents/${d.doc_id}`, { method: "DELETE" });
          const payload = await result.json();
          if (!result.ok) alert(payload.detail || "Document removal failed.");
          loadRag();
        };
        list.appendChild(row);
      });
      el.querySelector("#doc-add").onclick = async () => {
        const title = el.querySelector("#doc-title").value.trim();
        const body = el.querySelector("#doc-body").value.trim();
        const section_prefix = el.querySelector("#doc-prefix").value.trim();
        const access_roles = [];
        if (el.querySelector("#role-sales").checked) access_roles.push("sales_rep");
        if (el.querySelector("#role-finance").checked) access_roles.push("finance_manager");
        if (!title || !body || !section_prefix || !access_roles.length) {
          alert("Complete the title, section code, text, and at least one role.");
          return;
        }
        const button = el.querySelector("#doc-add");
        button.disabled = true;
        el.querySelector("#rag-status").textContent = " Re-indexing Qdrant...";
        const result = await fetch(`${API}/admin/rag/documents`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title, body, section_prefix, access_roles,
            department: el.querySelector("#doc-department").value.trim(),
            document_type: el.querySelector("#doc-type").value.trim()
          })
        });
        const payload = await result.json();
        if (!result.ok) alert(payload.detail || "Document indexing failed.");
        loadRag();
      };
      el.querySelector("#rag-reindex").onclick = async ev => {
        ev.target.disabled = true;
        ev.target.textContent = "Re-indexing...";
        const result = await fetch(`${API}/admin/rag/reindex`, { method: "POST" });
        const payload = await result.json();
        if (!result.ok) alert(payload.detail || "Re-index failed.");
        else alert(`Qdrant refreshed: ${payload.points} points in ${payload.collection}.`);
        loadRag();
      };
    }

    // ---------------- HITL Queue ----------------
    async function loadHitl() {
      const res = await fetch(`${API}/admin/hitl`);
      const tasks = await res.json();

      const el = document.getElementById("section-hitl");

      el.innerHTML = `
        <div class="card">
          <h3>Pending human decisions</h3>
          <div class="meta">
            A run only resumes after a decision is made here.
          </div>
          <div id="hitl-list"></div>
        </div>
      `;

      const list = el.querySelector("#hitl-list");

      if (tasks.length === 0) {
        list.innerHTML =
          '<div class="empty-state" style="padding:20px 0;">No HITL tasks.</div>';
      }

      tasks.forEach(t => {
        const row = document.createElement("div");
        row.className = "queue-row";

        row.innerHTML = `
          <div class="top-line">
            <span class="badge ${t.status}">
              ${t.status}
            </span>

            <span class="meta">
              ${esc(t.agent_id || "state graph")}
              · ${ago(t.created_at)}
              · run ${t.run_id.slice(0, 8)}
            </span>
          </div>

          <div class="reason">
            ${esc(t.reason)}
          </div>

          <details style="margin-top:10px;">
            <summary style="cursor:pointer;">
              View persisted state
            </summary>

            <pre style="white-space:pre-wrap; font-size:11px;">
    ${esc(JSON.stringify(t.state || {}, null, 2))}
            </pre>
          </details>

          <div class="actions">
            ${t.status === "pending"
            ? `
                  <button
                    class="btn clear act-approve"
                    style="padding:6px 12px;font-size:12px;">
                    Approve
                  </button>

                  <button
                    class="btn stop act-reject"
                    style="padding:6px 12px;font-size:12px;">
                    Reject
                  </button>
                `
            : `
                  <span class="meta">
                    Decided: ${esc(t.decision)}
                    by ${esc(t.decided_by || "—")}
                  </span>
                `
          }
          </div>
        `;

        if (t.status === "pending") {
          row.querySelector(".act-approve").onclick = () =>
            decide(t.task_id, "approve");

          row.querySelector(".act-reject").onclick = () =>
            decide(t.task_id, "reject");
        }

        list.appendChild(row);
      });
    }

    async function decide(taskId, decision) {
      await fetch(`${API}/admin/hitl/${taskId}/decide`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ decision, decided_by: "admin_jane" })
      });
      loadHitl();
    }

    // ---------------- Tickets ----------------
    async function loadTickets() {
      const res = await fetch(`${API}/admin/tickets`);
      const tickets = await res.json();

      const el = document.getElementById("section-tickets");

      el.innerHTML = `
        <div class="card">
          <h3>Failure tickets</h3>

          <div class="meta">
            Unplanned mid-node failures — distinct from HITL.
            Resolving resumes the run from its checkpoint.
          </div>

          <div id="ticket-list"></div>
        </div>
      `;

      const list = el.querySelector("#ticket-list");

      if (tickets.length === 0) {
        list.innerHTML =
          '<div class="empty-state" style="padding:20px 0;">No tickets.</div>';
      }

      tickets.forEach(t => {
        const row = document.createElement("div");
        row.className = "queue-row";

        row.innerHTML = `
          <div class="top-line">
            <span class="badge ${t.status}">
              ${t.status}
            </span>

            <span class="meta">
              ${esc(t.agent_id || "state graph")}
              · ${ago(t.created_at)}
              · run ${t.run_id.slice(0, 8)}
              · node ${esc(t.node_name || t.failed_node)}
            </span>
          </div>

          <div class="reason">
            ${esc(t.error_type)}: ${esc(t.error_message)}
          </div>

          <details style="margin-top:10px;">
            <summary style="cursor:pointer;">
              View persisted state
            </summary>

            <pre style="white-space:pre-wrap; font-size:11px;">
    ${esc(JSON.stringify(t.state || {}, null, 2))}
            </pre>
          </details>

          <div class="actions">

            ${t.status === "open"
            ? `
                  <button
                    class="btn ghost act-investigate"
                    style="padding:6px 12px;font-size:12px;">
                    Mark investigating
                  </button>
                `
            : ""
          }

            ${t.status === "investigating"
            ? `
                  <button
                    class="btn clear act-resolve"
                    style="padding:6px 12px;font-size:12px;">
                    Resolve & resume
                  </button>
                `
            : ""
          }

          </div>
        `;

        if (t.status === "open") {
          row.querySelector(".act-investigate").onclick = () =>
            setStatus(t.ticket_id, "investigating");
        }

        if (t.status === "investigating") {
          row.querySelector(".act-resolve").onclick = () =>
            setStatus(t.ticket_id, "resolved");
        }

        list.appendChild(row);
      });
    }
    async function setStatus(ticketId, status) {
      await fetch(`${API}/admin/tickets/${ticketId}/status`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status })
      });
      loadTickets();
    }

    function refreshAll() { loadAgents(); loadRag(); loadHitl(); loadTickets(); }
    refreshAll();
    // Do not reload the RAG form while an admin is typing a document.
    setInterval(() => { loadAgents(); loadHitl(); loadTickets(); }, 5000);
  </script>
</body>

</html>
